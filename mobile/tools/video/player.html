<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>دليل المندوب</title>
<!-- فيديو تعليمي — المسرح (1080×1920): كل إطارٍ يُرسم بـ renderAt(t) ثم يُلتقط.
     الألوان من لوحة التطبيق نفسها (الوضع الليلي). -->
<style>
  @font-face { font-family: Plex; src: url(../../web/fonts/IBMPlexSansArabic-Regular.ttf); font-weight: 400; }
  @font-face { font-family: Plex; src: url(../../web/fonts/IBMPlexSansArabic-SemiBold.ttf); font-weight: 600; }
  @font-face { font-family: Plex; src: url(../../web/fonts/IBMPlexSansArabic-Bold.ttf); font-weight: 700; }
  :root {
    --bg: #15130F; --surface: #1E1C17; --tot: #1C1A17; --bar: #2B2723; --line: #332E25; --line3: #554D3C;
    --ink: #FAF6EE; --muted: #C6BDAB; --gold: #C9A227; --goldHi: #E0B93E; --ring: #E4C665;
    --goldL: #9A7B22; --goldDim: #5E4A0C; --soft: #F3E9CE; --barFg: #F3EEE2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
  body { font-family: Plex, sans-serif; color: var(--ink); }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
  .abs { position: absolute; }
  /* الخلفية: وهجٌ ذهبيٌّ هادئ يتحرّك ببطء */
  .glow { position: absolute; border-radius: 50%; will-change: transform; }
  #g1 { width: 1100px; height: 1100px; background: radial-gradient(circle, rgba(201,162,39,.30), rgba(201,162,39,0) 62%); }
  #g2 { width: 900px; height: 900px; background: radial-gradient(circle, rgba(228,198,101,.18), rgba(228,198,101,0) 60%); }
  #g3 { width: 1400px; height: 700px; background: radial-gradient(ellipse, rgba(94,74,12,.45), rgba(94,74,12,0) 65%); }
  #vignette { inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); }
  #grain { inset: 0; opacity: .05; background-image: repeating-linear-gradient(115deg, rgba(255,255,255,.5) 0 1px, transparent 1px 7px); }

  /* رأس الفصل */
  #head { top: 92px; left: 70px; right: 70px; text-align: center; }
  #chip { display: inline-flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 600; color: var(--ring);
    border: 1.5px solid rgba(228,198,101,.45); border-radius: 999px; padding: 6px 26px 8px; background: rgba(43,39,35,.65); }
  #chip .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ring); box-shadow: 0 0 14px var(--ring); }
  #htitle { margin-top: 22px; font-size: 66px; font-weight: 700; line-height: 1.2; letter-spacing: 0; }
  #hline { margin: 18px auto 0; height: 4px; width: 220px; border-radius: 4px;
    background: linear-gradient(90deg, rgba(228,198,101,0), var(--ring), rgba(228,198,101,0)); transform-origin: center; }

  /* الجوال */
  #phone { left: 263.5px; top: 318px; width: 553px; height: 1156px; transform-origin: 0 0; border-radius: 74px;
    background: linear-gradient(145deg, #3A3120, #0B0907 40%, #1C1A17 70%, #3A3120);
    padding: 3px; box-shadow: 0 30px 70px rgba(0,0,0,.6), 0 0 0 1px rgba(228,198,101,.25);
    will-change: transform, opacity; }
  #bezel { width: 100%; height: 100%; border-radius: 71px; background: #0B0907; padding: 15px; position: relative; }
  #screen { position: relative; width: 517px; height: 1120px; border-radius: 56px; overflow: hidden; background: #F7F5F0; }
  #screen img.shot { position: absolute; left: 0; top: 0; width: 517px; height: 1120px; opacity: 0; transform-origin: 0 0; will-change: opacity, transform; }
  #fx { position: absolute; left: 0; top: 0; width: 517px; height: 1120px; transform-origin: 0 0; }
  #glass { position: absolute; inset: 0; border-radius: 56px; pointer-events: none;
    background: linear-gradient(120deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,0) 28%, rgba(255,255,255,0) 72%, rgba(255,255,255,.05) 100%); }
  #notch { position: absolute; top: 26px; left: 50%; width: 120px; height: 30px; margin-left: -60px; border-radius: 20px; background: #0B0907; }
  /* إبراز الزرّ المطلوب ولمسته */
  #hl { position: absolute; border-radius: 16px; border: 4px solid var(--ring);
    box-shadow: 0 0 0 6px rgba(228,198,101,.25), 0 0 30px rgba(228,198,101,.55); opacity: 0; }
  #finger { position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.95) 0 30%, rgba(228,198,101,.85) 31% 46%, rgba(228,198,101,0) 48%); opacity: 0; }
  #ripple { position: absolute; width: 200px; height: 200px; margin: -100px 0 0 -100px; border-radius: 50%;
    border: 5px solid var(--ring); opacity: 0; }

  /* شرح الخطوة */
  #cap { left: 52px; right: 52px; bottom: 96px; min-height: 230px; border-radius: 34px; padding: 28px 36px 30px;
    background: linear-gradient(160deg, #2B2723, #1C1A17);
    border: 1.5px solid rgba(228,198,101,.35); box-shadow: 0 30px 80px rgba(0,0,0,.45); }
  #cap .row { display: flex; align-items: flex-start; gap: 26px; }
  #stepn { flex: 0 0 auto; width: 86px; height: 86px; border-radius: 26px; display: flex; align-items: center; justify-content: center;
    font-size: 46px; font-weight: 700; color: #1A1305; background: linear-gradient(145deg, var(--ring), var(--gold) 55%, var(--goldL)); }
  #ct { font-size: 48px; font-weight: 700; line-height: 1.3; }
  #cs { margin-top: 10px; font-size: 33px; font-weight: 400; line-height: 1.55; color: var(--muted); }

  /* بطاقة الفصل */
  #card { inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; opacity: 0; }
  #cnum { font-size: 260px; font-weight: 700; line-height: 1; background: linear-gradient(170deg, #FFF4C8, var(--ring) 35%, var(--gold) 65%, var(--goldDim));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  #cof { font-size: 34px; font-weight: 600; color: var(--muted); margin-top: 10px; }
  #ctitle { font-size: 96px; font-weight: 700; margin-top: 26px; }
  #cdesc { font-size: 44px; color: var(--muted); margin-top: 18px; }
  #cline { margin-top: 46px; height: 5px; width: 520px; border-radius: 5px;
    background: linear-gradient(90deg, rgba(228,198,101,0), var(--ring), rgba(228,198,101,0)); }

  /* المقدّمة والختام */
  .full { inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; opacity: 0; }
  .logo { width: 360px; height: 360px; filter: drop-shadow(0 40px 80px rgba(0,0,0,.6)); }
  #ititle { font-size: 104px; font-weight: 700; margin-top: 70px; line-height: 1.15; }
  .shine { background: linear-gradient(100deg, var(--ink) 0%, var(--ink) 40%, #FFF4C8 48%, var(--ring) 50%, #FFF4C8 52%, var(--ink) 60%, var(--ink) 100%);
    background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; }
  #isub { font-size: 48px; color: var(--muted); margin-top: 30px; }
  #ichip { margin-top: 60px; font-size: 34px; font-weight: 600; color: var(--ring); border: 1.5px solid rgba(228,198,101,.45);
    border-radius: 999px; padding: 8px 34px 10px; }
  #halo { position: absolute; width: 900px; height: 900px; border-radius: 50%; left: 90px; top: 330px;
    background: radial-gradient(circle, rgba(228,198,101,.35), rgba(228,198,101,0) 60%); }
  #otitle { font-size: 130px; font-weight: 700; }
  .gold-text { background: linear-gradient(170deg, #FFF4C8, var(--ring) 35%, var(--gold) 65%, var(--goldDim));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  #olist { margin-top: 70px; text-align: right; }
  #olist div { font-size: 46px; line-height: 1.5; margin: 18px 0; display: flex; gap: 22px; align-items: baseline; }
  #olist .b { color: var(--ring); font-size: 40px; }
  #obrand { margin-top: 110px; display: flex; align-items: center; gap: 26px; font-size: 44px; font-weight: 700; }
  #obrand svg { width: 110px; height: 110px; }

  /* لوحة «ماذا تستفيد من النظام؟» */
  #ben { inset: 0; padding: 0 64px 110px; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; }
  #blogo { width: 128px; height: 128px; margin-bottom: 26px; }
  #btitle { font-size: 74px; font-weight: 700; text-align: center; line-height: 1.25; }
  #bline { margin: 22px auto 10px; height: 5px; width: 360px; border-radius: 5px;
    background: linear-gradient(90deg, rgba(228,198,101,0), var(--ring), rgba(228,198,101,0)); }
  #blist { width: 100%; }
  .bcard { display: flex; gap: 28px; align-items: flex-start; width: 100%; margin-top: 30px; padding: 30px 34px 32px;
    border-radius: 30px; background: linear-gradient(160deg, #2B2723, #1C1A17); border: 1.5px solid rgba(228,198,101,.2); }
  .bcard.on { border-color: var(--ring); box-shadow: 0 0 0 5px rgba(228,198,101,.16), 0 24px 60px rgba(0,0,0,.45); }
  .bnum { flex: 0 0 auto; width: 92px; height: 92px; border-radius: 26px; display: flex; align-items: center; justify-content: center;
    font-size: 52px; font-weight: 700; color: #1A1305; background: linear-gradient(145deg, var(--ring), var(--gold) 55%, var(--goldL)); }
  .bt { font-size: 50px; font-weight: 700; line-height: 1.3; }
  .bd { font-size: 34px; color: var(--muted); line-height: 1.55; margin-top: 8px; }
  #bfin { margin-top: 54px; font-size: 46px; font-weight: 700; text-align: center; line-height: 1.4; }

  /* النسخة الصامتة: الشرح بخطٍّ أكبر */
  body.silent #ct { font-size: 60px; }
  body.silent #cs { font-size: 40px; }

  /* شريط التقدّم والعلامة */
  #prog { left: 120px; right: 120px; top: 1858px; height: 8px; border-radius: 8px; background: rgba(243,238,226,.10); overflow: hidden; }
  #progf { position: absolute; top: 0; bottom: 0; right: 0; width: 0; border-radius: 8px;
    background: linear-gradient(270deg, var(--ring), var(--gold)); }
  .tick { position: absolute; top: 0; bottom: 0; width: 3px; background: rgba(21,19,15,.9); }
  #brand { display: none; }
  #fade { inset: 0; background: #000; opacity: 0; }
</style>
</head>
<body>
<div id="stage">
  <div id="g3" class="glow"></div><div id="g1" class="glow"></div><div id="g2" class="glow"></div>
  <div id="vignette" class="abs"></div><div id="grain" class="abs"></div>

  <div id="head" class="abs">
    <div id="chip"><span class="dot"></span><span id="chipt"></span></div>
    <div id="htitle"></div>
    <div id="hline"></div>
  </div>

  <div id="phone" class="abs"><div id="bezel"><div id="screen">
    <div id="shots"></div>
    <div id="fx"><div id="hl"></div><div id="ripple"></div><div id="finger"></div></div>
    <div id="glass"></div>
  </div></div></div>

  <div id="cap" class="abs"><div class="row">
    <div id="stepn"></div>
    <div><div id="ct"></div><div id="cs"></div></div>
  </div></div>

  <div id="card" class="abs">
    <div id="cnum"></div><div id="cof"></div><div id="ctitle"></div><div id="cdesc"></div><div id="cline"></div>
  </div>

  <div id="intro" class="full abs">
    <div id="halo"></div>
    <div id="ilogo"></div>
    <div id="ititle" class="shine">نظام محاسبي للذهب</div>
    <div id="isub">دليل المندوب — خطوةً بخطوة</div>
    <div id="ichip">تطبيق أندرويد · مجاني</div>
  </div>

  <div id="outro" class="full abs">
    <div id="otitle" class="gold-text">أنت جاهز</div>
    <div id="olist">
      <div><span class="b">✦</span><span>أضف المصنع وعملاءك مرةً واحدة</span></div>
      <div><span class="b">✦</span><span>سجّل البضاعة، وبِع من الأطقم التي معك</span></div>
      <div><span class="b">✦</span><span>حصّل وسدّد، وأرسل الكشف صورةً</span></div>
    </div>
    <div id="obrand"><span id="ologo"></span><span>نظام محاسبي للذهب</span></div>
  </div>

  <div id="ben" class="abs">
    <div id="blogo"></div><div id="btitle" class="gold-text"></div><div id="bline"></div>
    <div id="blist"></div>
    <div id="bfin" class="gold-text"></div>
  </div>

  <div id="prog" class="abs"><div id="progf"></div></div>
  <div id="brand" class="abs">نظام محاسبي للذهب · دليل المندوب</div>
  <div id="fade" class="abs"></div>
</div>

<script>
// شعار الجوهرة (كأيقونة التطبيق) — مرسومٌ متّجهاً ليبقى حادّاً بأي حجم
function logoSvg() {
  return `<svg viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0D77E"/><stop offset="1" stop-color="#C9A227"/></linearGradient>
    <linearGradient id="lg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C9A227"/><stop offset="1" stop-color="#7A600F"/></linearGradient></defs>
    <rect x="4" y="4" width="184" height="184" rx="40" fill="#2B2723"/>
    <rect x="4.5" y="4.5" width="183" height="183" rx="39.5" fill="none" stroke="#E4C665" stroke-opacity=".25"/>
    <g stroke="#2B2723" stroke-width="3" stroke-linejoin="round">
      <polygon points="62,58 130,58 156,84 36,84" fill="url(#lg1)"/>
      <polygon points="62,58 80,84 36,84" fill="#E4C665"/>
      <polygon points="130,58 112,84 156,84" fill="#B08E2A"/>
      <polygon points="80,84 96,58 112,84" fill="#F3E9CE" fill-opacity=".55"/>
      <polygon points="36,84 156,84 96,154" fill="url(#lg2)"/>
      <polygon points="36,84 80,84 96,154" fill="#C9A227"/>
      <polygon points="80,84 112,84 96,154" fill="#9A7B22"/>
      <polygon points="112,84 156,84 96,154" fill="#5E4A0C"/>
    </g>
    <path d="M150 30 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z" fill="#F3EEE2"/>
    <circle cx="134" cy="40" r="3" fill="#F3EEE2"/></svg>`;
}
document.getElementById("ilogo").innerHTML = `<div class="logo">${logoSvg()}</div>`;
document.getElementById("ologo").innerHTML = logoSvg();
document.getElementById("blogo").innerHTML = logoSvg();

const $ = (id) => document.getElementById(id);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const ease = (x) => { x = clamp(x, 0, 1); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const out = (x) => { x = clamp(x, 0, 1); return 1 - Math.pow(1 - x, 3); };
const AR = (n) => String(n).replace(/\d/g, (d) => "٠١٢٣٤٥٦٧٨٩"[d]);
// ظهورٌ بين [a, a+d] واختفاءٌ بين [b-d2, b]
const win = (t, a, d, b, d2) => Math.min(out((t - a) / d), 1 - ease((t - (b - d2)) / d2));

let TL = null, imgs = [];
window.setup = async function (tl) {
  TL = tl;
  const box = $("shots");
  for (const sg of TL.segments) {
    if (sg.type !== "shot") continue;
    const im = new Image();
    im.className = "shot";
    im.dataset.src = sg.file;
    box.appendChild(im);
    imgs[sg.idx] = im;
  }
  await document.fonts.ready;
  // نصوص المقدّمة والختام إن خُصِّصت، وخطٌّ أكبر للنسخة الصامتة
  if (TL.introSub) $("isub").textContent = TL.introSub;
  if (TL.introChip) $("ichip").textContent = TL.introChip;
  if (TL.outroTitle) $("otitle").textContent = TL.outroTitle;
  if (TL.outroLines) {
    $("olist").innerHTML = "";
    for (const l of TL.outroLines) {
      const d = document.createElement("div");
      d.innerHTML = `<span class="b">✦</span><span></span>`;
      d.lastChild.textContent = l;
      $("olist").appendChild(d);
    }
  }
  if (TL.silent) document.body.classList.add("silent");
  // بطاقات لوحة الفوائد
  const bs = TL.segments.find((x) => x.type === "benefits");
  if (bs) {
    $("btitle").textContent = bs.title;
    $("bfin").textContent = bs.fin.text;
    bs.items.forEach((it, i) => {
      const c = document.createElement("div");
      c.className = "bcard";
      c.innerHTML = `<div class="bnum">${AR(i + 1)}</div><div><div class="bt"></div><div class="bd"></div></div>`;
      c.querySelector(".bt").textContent = it.title;
      c.querySelector(".bd").textContent = it.detail;
      $("blist").appendChild(c);
    });
  }
  // علامات الفصول على شريط التقدّم
  for (const sg of TL.segments) {
    if (sg.type !== "chapter") continue;
    const d = document.createElement("div");
    d.className = "tick";
    d.style.right = (100 * sg.start / TL.total) + "%";
    $("prog").appendChild(d);
  }
  return true;
};

// تقريب الكاميرا: الجوال كلّه يكبر نحو المشاهد (فيبقى عرض التطبيق كاملاً)،
// والنقطة المقصودة إلى وسط ما بين أعلى المسرح وبطاقة الشرح
const PL = 263.5, PT = 318, PW = 553, PH = 1156, TOPV = 40, BOTV = 1450, YC = 740;
function zoomK(sg, p) {
  const z = sg.zoom;
  if (!z) return 0;
  const D = sg.end - sg.start;
  return clamp(Math.min(ease((p - z.at) / 1.1), 1 - ease((p - (D - .55)) / .55)), 0, 1);
}
function phoneXf(sg, p, base, yPin) {
  const k = zoomK(sg, p);
  const S = base * (1 + ((sg.zoom ? sg.zoom.s : 1) - 1) * k);
  const tx = (PW / 2) * (1 - S);
  const tyC = (PH / 2) * (1 - S) + yPin;
  let tyF = tyC;
  if (sg.zoom) {
    tyF = YC - PT - S * (18 + sg.zoom.fy);
    const lo = Math.min(TOPV, BOTV - S * PH), hi = Math.max(TOPV, BOTV - S * PH);
    tyF = clamp(PT + tyF, lo, hi) - PT;
  }
  return { k, t: `translate(${tx}px, ${tyC + (tyF - tyC) * k}px) scale(${S})` };
}

// الصور تُحمَّل عند الحاجة: الحالية والسابقة والتالية فقط — والباقي يُفرَّغ
async function prep(keep) {
  const want = new Set(keep.filter((x) => x !== null && x !== undefined && imgs[x]));
  imgs.forEach((im, i) => { if (im && !want.has(i) && im.getAttribute("src")) im.removeAttribute("src"); });
  for (const i of want) {
    const im = imgs[i];
    if (im.getAttribute("src") !== im.dataset.src) { im.src = im.dataset.src; await im.decode(); }
  }
}
window.renderAt = async function (t) {
  {
    const s0 = TL.segments.find((s) => t >= s.start && t < s.end) || TL.segments[TL.segments.length - 1];
    if (s0.type === "shot") await prep([s0.idx, s0.prevIdx, s0.idx + 1]);
  }
  const T = TL.total;
  // الخلفية
  $("g1").style.transform = `translate(${-10 + 120 * Math.sin(t * .11)}px, ${180 + 160 * Math.cos(t * .07)}px)`;
  $("g2").style.transform = `translate(${420 + 140 * Math.cos(t * .09)}px, ${980 + 200 * Math.sin(t * .06)}px)`;
  $("g3").style.transform = `translate(${-160 + 60 * Math.sin(t * .05)}px, ${1280 + 60 * Math.cos(t * .08)}px)`;
  $("progf").style.width = (100 * clamp(t / T, 0, 1)) + "%";

  const sg = TL.segments.find((s) => t >= s.start && t < s.end) || TL.segments[TL.segments.length - 1];
  const p = t - sg.start, D = sg.end - sg.start;

  // المقدّمة
  const iv = sg.type === "intro" ? 1 : 0;
  // (في القصير تأتي بعد لوحة الفوائد، فتظهر تدريجاً)
  $("intro").style.opacity = iv ? Math.min(sg.start > 0 ? out(p / .6) : 1, 1 - ease((p - (D - .6)) / .6)) : 0;
  if (iv) {
    const lg = $("ilogo").firstChild;
    lg.style.transform = `scale(${.82 + .18 * out(p / 1.4)}) translateY(${40 * (1 - out(p / 1.4))}px)`;
    lg.style.opacity = out(p / 1);
    $("halo").style.opacity = .55 + .45 * Math.sin(p * 1.6) * out(p / 1.2);
    $("ititle").style.opacity = out((p - .7) / .8);
    $("ititle").style.transform = `translateY(${30 * (1 - out((p - .7) / .8))}px)`;
    $("ititle").style.backgroundPosition = `${100 - 100 * clamp((p - 1.6) / 2.2, 0, 1)}% 0`;
    $("isub").style.opacity = out((p - 1.4) / .8);
    $("ichip").style.opacity = out((p - 2.0) / .8);
  }
  // الختام
  const ov = sg.type === "outro";
  $("outro").style.opacity = ov ? out(p / .7) : 0;
  if (ov) {
    $("otitle").style.transform = `scale(${.9 + .1 * out(p / 1)})`;
    [...$("olist").children].forEach((el, i) => {
      el.style.opacity = out((p - .6 - i * .45) / .6);
      el.style.transform = `translateX(${-40 * (1 - out((p - .6 - i * .45) / .6))}px)`;
    });
    $("obrand").style.opacity = out((p - 2.2) / .8);
  }
  $("fade").style.opacity = Math.max(1 - out(t / .8), ov ? ease((p - (D - 1)) / 1) : 0);

  // لوحة الفوائد: كل بطاقةٍ تظهر مع صوتها، والحالية مُضاءة
  const bv = sg.type === "benefits";
  $("ben").style.opacity = bv ? win(p, 0, .6, D, .6) : 0;
  if (bv) {
    $("btitle").style.transform = `translateY(${30 * (1 - out(p / .8))}px)`;
    $("bline").style.transform = `scaleX(${out((p - .3) / 1)})`;
    [...$("blist").children].forEach((c, i) => {
      const it = sg.items[i], nx = i + 1 < sg.items.length ? sg.items[i + 1].at : sg.fin.at;
      const k = out((p - it.at + .15) / .55);
      c.style.opacity = k;
      c.style.transform = `translateX(${-50 * (1 - k)}px)`;
      c.classList.toggle("on", p >= it.at - .15 && p < nx - .1);
    });
    const kf = out((p - sg.fin.at + .1) / .7);
    $("bfin").style.opacity = kf;
    $("bfin").style.transform = `scale(${.92 + .08 * kf})`;
  }

  // بطاقة الفصل
  const cv = sg.type === "chapter";
  $("card").style.opacity = cv ? win(p, 0, .5, D, .45) : 0;
  if (cv) {
    $("cnum").textContent = AR(sg.n);
    $("cof").textContent = `الدرس ${AR(sg.n)} من ${AR(TL.chapters)}`;
    $("ctitle").textContent = sg.title;
    $("cdesc").textContent = sg.desc;
    $("cnum").style.transform = `scale(${.86 + .14 * out(p / .8)})`;
    $("ctitle").style.transform = `translateY(${30 * (1 - out((p - .15) / .6))}px)`;
    $("cdesc").style.opacity = out((p - .45) / .6);
    $("cline").style.transform = `scaleX(${out((p - .3) / 1.1)})`;
  }

  // مشهد الجوال: الرأس والشاشة والشرح
  const shotMode = sg.type === "shot";
  // الجوال يظهر بعد بطاقة الفصل ويختفي قبل التالية
  let phoneV = 0, head = null;
  if (shotMode) {
    const firstInCh = sg.firstInChapter, lastInCh = sg.lastInChapter;
    const pin = firstInCh ? out(p / .7) : 1;
    const pout = lastInCh ? 1 - ease((p - (D - .45)) / .45) : 1;
    phoneV = Math.min(pin, pout);
    head = sg;
    // تكبيرٌ هادئ، ثم تقريب الكاميرا إلى ما يُشرح
    const kb = 1 + .018 * (p / D);
    const xfm = phoneXf(sg, p, kb * (.94 + .06 * pin), (1 - pin) * 80);
    $("phone").style.transform = xfm.t;
    sg._zk = xfm.k;
    // الصورة: تمتزج من السابقة
    imgs.forEach((im, i) => { if (im) im.style.opacity = 0; });
    const cur = imgs[sg.idx];
    const xf = sg.prevIdx !== null ? out(p / .5) : 1;
    if (sg.prevIdx !== null && xf < 1) imgs[sg.prevIdx].style.opacity = 1;
    cur.style.opacity = xf;
    cur.style.transform = `translateY(${(1 - xf) * 14}px)`;
    // الإبراز واللمسة
    const hl = $("hl"), fg = $("finger"), rp = $("ripple");
    if (sg.tap) {
      const s = 517 / 393, pad = 6;
      const x = sg.tap.x * s - pad, yy = sg.tap.y * s - pad, w = sg.tap.width * s + 2 * pad, h = sg.tap.height * s + 2 * pad;
      Object.assign(hl.style, { left: x + "px", top: yy + "px", width: w + "px", height: h + "px" });
      const hs = .55;                        // يظهر الإبراز مع بدء الشرح
      const pulse = .75 + .25 * Math.sin((p - hs) * 5);
      const hend = sg.press ? sg.tapAt + .25 : D - .5;
      hl.style.opacity = clamp(out((p - hs) / .4), 0, 1) * (p > hend ? 1 - out((p - hend) / .3) : pulse);
      const cx = (sg.tap.x + sg.tap.width / 2) * s, cy = (sg.tap.y + sg.tap.height / 2) * s;
      fg.style.left = rp.style.left = cx + "px";
      fg.style.top = rp.style.top = cy + "px";
      const q = sg.press ? p - sg.tapAt : -99;   // 0 = لحظة اللمس (للأزرار وحدها)
      fg.style.opacity = q < -.35 ? 0 : q < 0 ? out((q + .35) / .35) : 1 - out((q - .25) / .35);
      fg.style.transform = `scale(${q < 0 ? 1.25 - .25 * out((q + .35) / .35) : .9})`;
      rp.style.opacity = q < 0 || q > 2 ? 0 : (1 - out(q / .7)) * .9;
      rp.style.transform = `scale(${.2 + .9 * out(q / .7)})`;
    } else { hl.style.opacity = fg.style.opacity = rp.style.opacity = 0; }
    // الشرح
    const cin = out((p - .2) / .55), cout = 1 - ease((p - (D - .4)) / .4);
    const cv2 = Math.min(cin, sg.nextSameChapter ? cout : Math.min(cout, pout));
    $("cap").style.opacity = cv2;
    $("cap").style.transform = `translateY(${(1 - cin) * 40}px)`;
    $("stepn").textContent = AR(sg.step);
    $("ct").textContent = sg.title;
    $("cs").textContent = sg.sub;
    $("cs").style.display = sg.sub ? "" : "none";
  } else {
    $("cap").style.opacity = 0;
  }
  $("phone").style.opacity = phoneV;
  // رأس الفصل فوق الجوال
  const hv = shotMode ? phoneV * (1 - (sg._zk || 0)) : 0;
  $("head").style.opacity = hv;
  if (head) {
    $("chipt").textContent = TL.short ? `الخطوة ${AR(head.step)} من ${AR(head.steps)}`
      : `الدرس ${AR(head.chapter)} · الخطوة ${AR(head.step)} من ${AR(head.steps)}`;
    $("htitle").textContent = head.chapterTitle;
    $("hline").style.transform = `scaleX(${head.firstInChapter ? out((t - head.start - .2) / .9) : 1})`;
  }
  $("prog").style.opacity = $("brand").style.opacity = (sg.type === "intro" || sg.type === "outro") ? 0 : 1;
  return true;
};
</script>
</body>
