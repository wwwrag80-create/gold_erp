plugins {
    id 'com.android.application'
}

// رقم الإصدار من ملفٍ واحد يقرؤه التطبيق والبناء معاً
def ver = new groovy.json.JsonSlurper().parse(file("../../web/version.json"))
// معرّفات AdMob (mobile/android/admob.properties) — التطبيق والشريط الإعلاني
def admob = new Properties()
file("../admob.properties").withInputStream { admob.load(it) }
def admobApp = admob.getProperty("ADMOB_APP_ID").trim()
def admobBanner = admob.getProperty("ADMOB_BANNER_ID").trim()
// معرّفات Google التجريبية: لا إعلان في النسخة المنشورة (Ads.enabled)
def admobTest = admobApp.startsWith("ca-app-pub-3940256099942544")

android {
    namespace 'com.jadeite.mobile'
    // أندرويد 16 (API 36): ما يشترطه Google Play للتطبيقات الجديدة وتحديثاتها
    compileSdk 36

    defaultConfig {
        applicationId "com.jadeite.mobile"
        minSdk 24
        targetSdk 36
        versionCode ver.code as int
        versionName ver.name as String
        manifestPlaceholders = [admobAppId: admobApp]
        buildConfigField "String", "ADMOB_BANNER_ID", "\"${admobBanner}\""
        buildConfigField "boolean", "ADMOB_TEST_IDS", "${admobTest}"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    // نسختان من الكود نفسه: «direct» (الرابط المباشر — يحدّث نفسه من GitHub كما كان)،
    // و«play» لمتجر Google Play: لا تحديث ذاتي ولا إذن تثبيت (سياسة المتجر —
    // التحديث عبره وحده)، وما سوى ذلك واحد
    flavorDimensions = ["store"]
    productFlavors {
        direct {
            dimension "store"
            buildConfigField "boolean", "SELF_UPDATE", "true"
        }
        play {
            dimension "store"
            buildConfigField "boolean", "SELF_UPDATE", "false"
        }
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // واجهة التطبيق (mobile/web) تُنسخ إلى أصوله عند كل بناء
    sourceSets {
        main {
            assets.srcDirs += ["$buildDir/webassets"]
        }
    }
}

tasks.register('copyWeb', Copy) {
    from '../../web'
    into "$buildDir/webassets/web"
}
preBuild.dependsOn copyWeb

dependencies {
    implementation 'androidx.webkit:webkit:1.8.0'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    // إعلان AdMob (شريطٌ صغير) وموافقة المستخدم حيث يلزمها القانون (UMP)
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
    implementation 'com.google.android.ump:user-messaging-platform:3.1.0'
}
