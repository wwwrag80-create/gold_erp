# معرّفات AdMob — تُقرأ عند البناء (app/build.gradle).
# من حساب المالك في admob.google.com:
#   ADMOB_APP_ID    = التطبيقات ← إعدادات التطبيق ← «App ID»          (ca-app-pub-…~…)
#   ADMOB_BANNER_ID = التطبيقات ← وحدات الإعلان ← «Banner» تكيّفي     (ca-app-pub-…/…)
# المعرّفات ليست أسراراً (تظهر في كل تطبيقٍ منشور)، فمكانها هنا.
#
# معرّفات المالك (تطبيق Android في حسابه) — للنسخة المنشورة وحدها. نسخة التطوير
# والمحاكي تستخدم معرّفات Google التجريبية دائماً (app/build.gradle) فلا يُطلب إعلانٌ
# حقيقي أثناء التجربة.
ADMOB_APP_ID=ca-app-pub-2600352063526857~2074139079
ADMOB_BANNER_ID=ca-app-pub-2600352063526857/7135940240

# أنواعٌ أخرى — مُعدّةٌ هنا وغير مفعّلة عمداً (لا كود يعرضها). تُفعَّل بقرار المالك وحده:
#   ADMOB_INTERSTITIAL_ID = إعلان بملء الشاشة (بين الشاشات)       — غير مفعّل
#   ADMOB_REWARDED_ID     = إعلان بمكافأة (يختاره المستخدم بنفسه)   — غير مفعّل
#   ADMOB_NATIVE_ID       = إعلان مدمج في القوائم                  — غير مفعّل
