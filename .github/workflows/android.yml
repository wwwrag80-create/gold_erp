name: تطبيق الجوال (أندرويد)

# يبني تطبيق «جاديت للجوال» من mobile/ : يفحص معادلاته مقابل البرنامج
# (بايثون) أولاً، ثم يبني ملف التثبيت، ثم يجرّبه على محاكي أندرويد حقيقي.
# الملف يُنشر **غير موقّع** — التوقيع بمفتاح المالك يتمّ خارج المستودع،
# فلا مفتاح ولا سرّ هنا. ونتائج التجربة وصورها تُرفق بالإصدار نفسه.
on:
  push:
    branches: ["claude/gold-accounting-system-9o1vmw"]
    paths: ["mobile/**", ".github/workflows/android.yml", "!mobile/dist/**", "!mobile/ios/**", "!mobile/store/**", "!mobile/tools/video/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: معادلات الجوال تطابق البرنامج
        run: |
          python mobile/tests/parity_gen.py > "$RUNNER_TEMP/cases.json"
          node mobile/tests/parity.js "$RUNNER_TEMP/cases.json"
          node mobile/tests/domain.test.js
          node mobile/tests/i18n.test.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        id: sg
        continue-on-error: true
        with:
          gradle-version: "8.13"

      # إن تعطّلت خدمة Gradle (رأيناها تردّ 504 ساعةً كاملة): تنزيلٌ مباشر بمحاولاتٍ متكرّرة،
      # وإلا Gradle المثبّت على جهاز البناء — فلا يتوقّف البناء على عطلٍ خارجه
      - name: Gradle احتياطي عند تعطّل الخدمة
        if: steps.sg.outcome == 'failure'
        run: |
          for u in https://services.gradle.org/distributions/gradle-8.13-bin.zip \
                   https://downloads.gradle.org/distributions/gradle-8.13-bin.zip; do
            for i in 1 2 3 4 5 6; do
              if curl -fsSL --retry 2 -o "$RUNNER_TEMP/gradle.zip" "$u"; then break 2; fi
              echo "محاولة $i لـ $u لم تنجح"; sleep 20
            done
          done
          if [ -s "$RUNNER_TEMP/gradle.zip" ]; then
            unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP" && echo "$RUNNER_TEMP/gradle-8.13/bin" >> "$GITHUB_PATH"
          elif command -v gradle >/dev/null; then
            echo "Gradle المثبّت: $(gradle --version | grep '^Gradle')"
          else
            echo "::error::لا Gradle — خدمة التنزيل معطّلة"; exit 1
          fi

      # و«play» ملف APK أيضاً: لمتاجر تطلب APK (متجر شاومي GetApps…) — بلا تحديثٍ ذاتي ولا إذن تثبيت
      - name: بناء ملف التثبيت (والنسخة التجريبية للمحاكي) وحزمة Google Play وملف المتاجر
        working-directory: mobile/android
        run: gradle --no-daemon --stacktrace assembleDirectRelease assembleDirectDebug bundlePlayRelease assemblePlayRelease

      # حزمة المتجر: تُفحص قبل أي رفع — API 36، وبلا أذونات التحديث الذاتي
      - name: فحص حزمة Google Play (AAB)
        run: |
          AAB=mobile/android/app/build/outputs/bundle/playRelease/app-play-release.aab
          curl -sSL -o "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle="$AAB"
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$AAB" > "$RUNNER_TEMP/play-manifest.xml"
          grep -o 'targetSdkVersion="[0-9]*"' "$RUNNER_TEMP/play-manifest.xml"
          grep -q 'targetSdkVersion="36"' "$RUNNER_TEMP/play-manifest.xml"
          # (فحصٌ بـ if: سطر «! grep» لا يُفشل الخطوة في bash -e — يُتجاهَل الأمر المعكوس)
          if grep -q "REQUEST_INSTALL_PACKAGES" "$RUNNER_TEMP/play-manifest.xml"; then echo "::error::إذن تثبيت في حزمة Play"; exit 1; fi
          # ولا خدمة التحديث الذاتي (سياسة Play: التحديث من المتجر وحده) — هي في نسخة الرابط وحدها
          if grep -q "UpdateJobService" "$RUNNER_TEMP/play-manifest.xml"; then echo "::error::خدمة التحديث الذاتي في حزمة Play"; exit 1; fi
          grep -q "com.google.android.gms.ads.APPLICATION_ID" "$RUNNER_TEMP/play-manifest.xml"
          echo "AAB ok"
          # ملف المتاجر (APK) من النسخة نفسها: لا إذن تثبيت فيه
          APK=mobile/android/app/build/outputs/apk/play/release/app-play-release-unsigned.apk
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT" dump permissions "$APK" | tee "$RUNNER_TEMP/play-apk-perms.txt"
          if grep -q "REQUEST_INSTALL_PACKAGES" "$RUNNER_TEMP/play-apk-perms.txt"; then echo "::error::إذن تثبيت في ملف المتاجر"; exit 1; fi
          if "$AAPT" dump xmltree --file AndroidManifest.xml "$APK" | grep -q "UpdateJobService"; then echo "::error::خدمة التحديث الذاتي في ملف المتاجر"; exit 1; fi
          # ونسخة الرابط ما زالت تحدّث نفسها
          "$AAPT" dump xmltree --file AndroidManifest.xml mobile/android/app/build/outputs/apk/direct/release/app-direct-release-unsigned.apk | grep -q "UpdateJobService"
          "$AAPT" dump badging "$APK" | grep -E "^package:|targetSdkVersion"
          echo "store APK ok"

      - name: نشر الملف (غير موقّع)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(python -c "import json;print(json.load(open('mobile/web/version.json'))['name'])")
          cp mobile/android/app/build/outputs/apk/direct/release/app-direct-release-unsigned.apk jadeite-mobile-unsigned.apk
          sha256sum jadeite-mobile-unsigned.apk | tee jadeite-mobile-unsigned.apk.sha256
          cp mobile/android/app/build/outputs/bundle/playRelease/app-play-release.aab jadeite-mobile-play-unsigned.aab
          sha256sum jadeite-mobile-play-unsigned.aab | tee jadeite-mobile-play-unsigned.aab.sha256
          cp mobile/android/app/build/outputs/apk/play/release/app-play-release-unsigned.apk jadeite-mobile-play-unsigned.apk
          sha256sum jadeite-mobile-play-unsigned.apk | tee jadeite-mobile-play-unsigned.apk.sha256
          gh release delete mobile-unsigned --yes --cleanup-tag || true
          gh release create mobile-unsigned jadeite-mobile-unsigned.apk jadeite-mobile-unsigned.apk.sha256 \
            jadeite-mobile-play-unsigned.aab jadeite-mobile-play-unsigned.aab.sha256 \
            jadeite-mobile-play-unsigned.apk jadeite-mobile-play-unsigned.apk.sha256 \
            --prerelease --target "$GITHUB_SHA" \
            --title "Jadeite mobile $V — unsigned build" \
            --notes "Unsigned build of mobile/ at ${GITHUB_SHA::7}. Not installable as is: it is signed with the owner's key outside this repository. Device test results are attached when the emulator run finishes."

      - name: تمكين KVM للمحاكي
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: التجربة على جهاز أندرويد (محاكٍ)
        id: device
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        env:
          OUT: device-out
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash mobile/tests/device_test.sh

      # أندرويد 15: التطبيق يُرسم تحت شريطي النظام (targetSdk 36) — صورٌ للتحقّق أن
      # الصفحة مزاحةٌ عنهما وأن لا انهيار
      - name: أندرويد 15 — الحواف (edge-to-edge)
        id: edge
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        env:
          OUT: device-out
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # ثم نسخة المتاجر (play): تُثبَّت وتفتح بلا انهيار — بلا شبكة (فلا طلب إعلانٍ حقيقي)
          script: bash mobile/tests/edge_test.sh; E=$?; bash mobile/tests/store_smoke.sh; S=$?; exit $((E | S))

      - name: إرفاق نتائج التجربة بالإصدار
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -d device-out ]; then
            cd device-out && zip -q -r ../device-test.zip . && cd ..
            gh release upload mobile-unsigned device-test.zip --clobber || true
            cat device-out/result.json || true
          fi

      - name: نتيجة التجربة على الجهاز
        if: steps.device.outcome != 'success' || steps.edge.outcome != 'success'
        run: |
          echo "فشلت التجربة على المحاكي — التفاصيل في device-test.zip"
          exit 1
