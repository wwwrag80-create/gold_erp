name: تطبيق الجوال (أندرويد)

# يبني تطبيق «جاديت للجوال» من mobile/ : يفحص معادلاته مقابل البرنامج
# (بايثون) أولاً، ثم يبني ملف التثبيت، ثم يجرّبه على محاكي أندرويد حقيقي.
# الملف يُنشر **غير موقّع** — التوقيع بمفتاح المالك يتمّ خارج المستودع،
# فلا مفتاح ولا سرّ هنا. ونتائج التجربة وصورها تُرفق بالإصدار نفسه.
on:
  push:
    branches: ["claude/gold-accounting-system-9o1vmw"]
    paths: ["mobile/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: معادلات الجوال تطابق البرنامج
        run: |
          python mobile/tests/parity_gen.py > "$RUNNER_TEMP/cases.json"
          node mobile/tests/parity.js "$RUNNER_TEMP/cases.json"
          node mobile/tests/domain.test.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: بناء ملف التثبيت (والنسخة التجريبية للمحاكي)
        working-directory: mobile/android
        run: gradle --no-daemon --stacktrace assembleRelease assembleDebug

      - name: نشر الملف (غير موقّع)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(python -c "import json;print(json.load(open('mobile/web/version.json'))['name'])")
          cp mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk jadeite-mobile-unsigned.apk
          sha256sum jadeite-mobile-unsigned.apk | tee jadeite-mobile-unsigned.apk.sha256
          gh release delete mobile-unsigned --yes --cleanup-tag || true
          gh release create mobile-unsigned jadeite-mobile-unsigned.apk jadeite-mobile-unsigned.apk.sha256 \
            --prerelease --target "$GITHUB_SHA" \
            --title "Jadeite mobile $V — unsigned build" \
            --notes "Unsigned build of mobile/ at ${GITHUB_SHA::7}. Not installable as is: it is signed with the owner's key outside this repository. Device test results are attached when the emulator run finishes."

      - name: تمكين KVM للمحاكي
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: التجربة على جهاز أندرويد (محاكٍ)
        id: device
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        env:
          OUT: device-out
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash mobile/tests/device_test.sh

      - name: إرفاق نتائج التجربة بالإصدار
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -d device-out ]; then
            cd device-out && zip -q -r ../device-test.zip . && cd ..
            gh release upload mobile-unsigned device-test.zip --clobber || true
            cat device-out/result.json || true
          fi

      - name: نتيجة التجربة على الجهاز
        if: steps.device.outcome != 'success'
        run: |
          echo "فشلت التجربة على المحاكي — التفاصيل في device-test.zip"
          exit 1
