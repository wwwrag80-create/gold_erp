name: فحوص النظام

# الأدوات الأربعة كانت تُشغَّل يدوياً فقط، فكان يمكن أن يدخل عطل
# للفرع الرئيسي بلا أن يوقفه شيء. تشغيلها آلياً على كل دفع وكل طلب
# دمج يجعل الفحص شرطاً لا خطوة تُنسى.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  # دفعة جديدة على الفرع نفسه تُلغي الفحص الجاري — لا فائدة من
  # إكمال فحص كود استُبدل أصلاً.
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # الشاشات تُبنى بلا خادم عرض؛ بدون هذا يفشل Qt عند أول QWidget
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: مكتبات النظام التي يحتاجها Qt
        # libQt5Gui يرتبط بـ libGL حتى في وضع offscreen، وبقيتها
        # يحتاجها محرك الخطوط وحافلة الرسائل.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libglib2.0-0 libdbus-1-3 \
            libxkbcommon0 libfontconfig1 libfreetype6

      - name: تثبيت المتطلبات
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1) الفحص الوقائي — selfcheck
        run: python tools/selfcheck.py

      - name: 2) صائد الأخطاء الصامتة — audit
        run: python tools/audit.py

      - name: 3) الترجمة والشاشات والمعالجات — verify_all
        run: python tools/verify_all.py

      - name: 4) دورة العمل الكاملة والأرقام — smoke_flow
        # هذا هو الفحص الذي يُثبت أن ما يخرج من النظام **صحيح**،
        # لا أنه يعمل فقط: توازن الدفتر في البعدين بعد كل خطوة.
        run: python tools/smoke_flow.py

      - name: سجل الأخطاء عند الفشل
        if: failure()
        run: |
          echo "=== data/system_errors.log ==="
          cat data/system_errors.log 2>/dev/null || echo "(لا يوجد)"
